<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Resume Screening | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #f4f7fb;
        }

        /* Navbar */
        .navbar {
            background: linear-gradient(135deg, #2563eb, #1e40af);
            padding: 18px 40px;
            color: white;
            font-size: 22px;
            font-weight: 600;
        }

        /* Main container */
        .container {
            max-width: 1000px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .container h2 {
            margin-bottom: 25px;
            color: #1f2937;
            font-size: 24px;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #374151;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-size: 14px;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px dashed #9ca3af;
            border-radius: 8px;
            background: #f9fafb;
        }

        /* Button */
        .btn {
            margin-top: 20px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #2563eb, #1e40af);
            color: white;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(37,99,235,0.4);
        }

        /* Footer text */
        .note {
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
            color: #6b7280;
        }
    </style>
</head>
<body>

    <div class="navbar">
        Hire Nova Dashboard
    </div>

    <div class="container">
        <h2>Upload Job Description & Resumes</h2>
        <form action="/upload" method="POST" enctype="multipart/form-data">

    <div class="form-group">
        <label>Job Description</label>
        <textarea name="job_description" placeholder="Paste job description here..." required></textarea>
    </div>

    <div class="form-group">
        <label>Upload Resumes (PDF / DOCX)</label>
        <input type="file" name="resumes" multiple accept=".pdf,.docx" required>
    </div>

    <button class="btn" type="submit">Upload & Rank Resumes</button>

</form>


        

        <div class="note">
            Supported format: PDF,DOCX | Multiple resumes allowed
        </div>
    </div>

</body>
</html>
